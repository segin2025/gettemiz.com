<!DOCTYPE html>
<html lang="tr">
<head>

  <title>Temiz — Daha temiz seç.</title>
  <style>

    .badges { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .badge { padding: 12px 24px; border-radius: 12px; background: #1C1C1E; color: #F5F5F0; font-size: 14px; font-weight: 600; text-decoration: none; }
    .footer { margin-top: 48px; font-size: 12px; color: #9CA3AF; }
    .footer a { color: #7D8F82; }
  </style>
</head>

  <div class="container">
    <div class="logo">TEMİZ</div>
    <div class="slogan">Daha temiz seç.</div>
    <p class="desc">Gıda etiketlerini tara, içindekileri anla, aileniz için bilinçli seçimler yapın. Yapay zeka destekli beslenme asistanınız.</p>
    <div class="badges">
      <a href="#" class="badge">App Store'da</a>
      <a href="#" class="badge">Google Play'de</a>
